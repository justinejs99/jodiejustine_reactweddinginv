<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logojj.png" />
    <link rel="preload" as="image" href="./src/assets/images/Bubblepic_1_home.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="./src/assets/images/Bubblepic_2_home.jpg" />
    <title>Reception Home</title>
    <link rel="stylesheet" href="./homereception.css" />
  </head>
  <body>
    <main class="home-reception-shell">
      <div class="slideshow" aria-hidden="true">
        <div class="slide slide-1 is-active"></div>
        <div class="slide slide-2"></div>
        <div class="slide slide-3"></div>
        <div class="slide slide-4"></div>
        <div class="slideshow-overlay"></div>
      </div>
      <section class="home-reception-overlay">
        <div class="home-reception-center">
          <p class="home-eyebrow">Welcome to the wedding of</p>
          <h1 class="home-names">
            Jodie
            <img src="./src/assets/images/and-white.jpg" alt="and" class="home-and-img" />
            Justine
          </h1>
          <p class="event-line">Saturday, 10 October 2026</p>
          <p class="event-line">Hotel Mercure Samarinda</p>
        </div>

        <a class="guest-signin-btn" href="./reception.html">Guest Sign In</a>
      </section>
    </main>

    <script>
      (function () {
        const slides = Array.from(document.querySelectorAll('.slide'));
        if (slides.length <= 1) {
          return;
        }

        let currentIndex = 0;
        const switchEveryMs = 3600;

        window.setInterval(() => {
          const nextIndex = (currentIndex + 1) % slides.length;
          slides[currentIndex].classList.remove('is-active');
          slides[nextIndex].classList.add('is-active');
          currentIndex = nextIndex;
        }, switchEveryMs);
      })();
    </script>
  </body>
</html>
